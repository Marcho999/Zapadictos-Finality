services:
  db:
    image: postgres:18-alpine
    container_name: zapadictos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zapadictos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-zapadictos}
    ports:
      # Solo escucha en localhost: la base no queda expuesta a la red.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
