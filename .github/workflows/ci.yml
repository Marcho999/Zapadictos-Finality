name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permisos mínimos: el CI solo necesita leer el código (docs/06-seguridad.md A08).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: zapadictos
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: zapadictos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zapadictos -d zapadictos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      # Valores solo para CI; no son secretos reales.
      DATABASE_URL: postgresql://zapadictos:ci-only-password@localhost:5432/zapadictos
      DATABASE_URL_TEST: postgresql://zapadictos:ci-only-password@localhost:5432/zapadictos_test
      WEB_ORIGIN: http://localhost:3000
      SEED_ADMIN_EMAIL: admin@zapadictos.test
      SEED_ADMIN_PASSWORD: ci-only-admin-password
      ADMIN_JWT_SECRET: ci-only-jwt-secret-that-is-long-enough-123456
      CUSTOMER_JWT_SECRET: ci-only-customer-secret-also-long-enough-789
      WOMPI_PUBLIC_KEY: pub_test_ci
      WOMPI_INTEGRITY_SECRET: ci-integrity-secret
      WOMPI_EVENTS_SECRET: ci-events-secret

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias (con el lockfile exacto)
        run: pnpm install --frozen-lockfile

      - name: Auditoría de dependencias
        run: pnpm audit --audit-level=high

      - name: Compilar el paquete compartido
        run: pnpm --filter @zapadictos/shared build

      - name: Validar el esquema de Prisma
        run: pnpm --filter @zapadictos/api exec prisma validate

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Pruebas unitarias
        run: pnpm test

      - name: Pruebas e2e de la API
        run: pnpm --filter @zapadictos/api test:e2e

      - name: Build
        run: pnpm build
